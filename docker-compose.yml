services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sorolens
      POSTGRES_USER: sorolens
      POSTGRES_PASSWORD: sorolens
    command: ["postgres", "-c", "wal_level=replica", "-c", "archive_mode=on", "-c", "archive_command=aws s3 cp %p s3://sorolens-backups/wal/%f"]
    ports:
      - "5432:5432"
    volumes:
      - sorolens_postgres_data:/var/lib/postgresql/data
    networks:
      - sorolens_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sorolens -d sorolens"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - sorolens_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # MinIO provides an S3-compatible endpoint so the cold-storage tier
  # (issue #146) can be exercised locally and in integration tests.
  # Console: http://localhost:9001 (sorolens / sorolens123)
  # Create the bucket once with:
  #   docker compose exec minio mc mb --ignore-existing local/sorolens-archive
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: sorolens
      MINIO_ROOT_PASSWORD: sorolens123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - sorolens_minio_data:/data
    networks:
      - sorolens_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  adminer:
    image: adminer
    ports:
      - "8081:8080"
    networks:
      - sorolens_net
    depends_on:
      - postgres

volumes:
  sorolens_postgres_data:
  sorolens_minio_data:

networks:
  sorolens_net:
    name: sorolens_net
