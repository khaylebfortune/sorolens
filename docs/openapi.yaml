          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [API v2]
      summary: Register a contract for tracking
      operationId: v2RegisterContract
      security:
        - ApiKeyAuth: []
        - RoleAuth: []
      requestBody:
        required: true
