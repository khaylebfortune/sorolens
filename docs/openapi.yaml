        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        "200":
          description: Recent events, newest first
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/Event"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/stats/activity:
    get:
      tags: [Live]
      summary: Per-contract events per minute (sparklines and leaderboard)
      operationId: liveActivity
      security:
        - ApiKeyAuth: [read:contracts]
      parameters:
        - name: minutes
          in: query
          required: false
          schema:
            type: integer
            default: 30
            maximum: 1440
      responses:
        "200":
          description: Contracts with activity in the window, hottest first
          content:
            application/json:
              schema:
                type: object
                required: [minutes, window_start, contracts]
                properties:
                  minutes:
                    type: integer
                  window_start:
                    type: string
                    format: date-time
                  contracts:
                    type: array
                    items:
                      $ref: "#/components/schemas/ContractEventRate"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/contracts/validate:
    post:
      tags: [Contracts]
      summary: Validate a contract id before tracking it
      operationId: validateContract
      security:
        - ApiKeyAuth: [read:contracts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contract_id, network]
              properties:
                contract_id:
                  type: string
                network:
                  type: string
      responses:
        "200":
          description: |
            Validation report. `valid` is false and `reason` explains why when
            the id is malformed; `already_tracked` is advisory so clients can
            redirect to the existing entry instead of creating a duplicate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateContractResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

