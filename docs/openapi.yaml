      summary: List API key metadata (admin)
      operationId: v2ListAPIKeys
      security:
        - ApiKeyAuth: []
        - RoleAuth: []
      responses:
        "200":
          description: Key metadata; the token is never returned
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [API v2]
      summary: Create an API key (admin)
      operationId: v2CreateAPIKey
      security:
        - ApiKeyAuth: []
        - RoleAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name:
                  type: string
                scopes:
                  type: array
                  items:
                    type: string
      responses:
        "201":
          description: Key created; the plaintext token is returned exactly once
          content:
            application/json:
              schema:
                type: object
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v2/api-keys/{id}:
    delete:
      tags: [API v2]
      summary: Revoke an API key (admin)
      operationId: v2RevokeAPIKey
      security:
        - ApiKeyAuth: []
        - RoleAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Revoked
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v2/admin/keys:
    get:
      tags: [API v2]
      summary: List API keys (admin role, v1 shape)
      operationId: v2AdminListKeys
      security:
        - RoleAuth: []
      responses:
        "200":
          description: Key metadata
          content:
            application/json:
              schema:
                type: object
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [API v2]
      summary: Create an API key (admin role, v1 shape)
      operationId: v2AdminCreateKey
      security:
        - RoleAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Key created
          content:
            application/json:
              schema:
                type: object
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v2/admin/keys/{id}:
    delete:
      tags: [API v2]
      summary: Revoke an API key (admin role, v1 shape)
      operationId: v2AdminRevokeKey
      security:
        - RoleAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Revoked
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: "Scoped API key. Send as `Authorization: Bearer <token>` (or `X-API-Key`)."
    RoleAuth:
      type: apiKey
      in: header
      name: X-User-ID
      description: |
        Role-based auth. Resolve a user identity from one of
        X-User-ID, X-GitHub-Login, X-User-Sub, or X-GitHub-ID and enforce the
        minimum role declared next to this security scheme.
    IdentityHeaderAuth:
      type: apiKey
      in: header
      name: X-User-ID
      description: Watchlist endpoints read the user ID from X-User-ID.

  parameters:
    ContractID:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Contract ID (starts with C).
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque pagination cursor from a previous response.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
      description: Page size (default 50, clamped to 200).
    NetworkParam:
      name: network
      in: query
      required: false
      schema:
        type: string
        enum: [testnet, mainnet, futurenet, standalone]
      description: Network filter; empty means all networks.
    UserIDHeader:
      name: X-User-ID
      in: header
      required: true
      schema:
        type: string
      description: Caller user ID.
    WatchlistContractID:
      name: contractId
      in: path
      required: true
      schema:
        type: string
      description: Contract ID in the watchlist path.
    V2Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque cursor taken from `pagination.next_cursor`.
    V2Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
      description: Page size (default 50, clamped to 200).
    V2Network:
      name: network
      in: query
      required: false
      schema:
        type: string
        enum: [testnet, mainnet, futurenet, standalone]
      description: Network filter; omitted or `all` means every network.
    V2Status:
      name: status
      in: query
      required: false
      schema:
        type: string
      description: Status filter, e.g. `active`.
    V2Minutes:
      name: minutes
      in: query
      required: false
      schema:
        type: integer
        default: 30
        maximum: 1440
      description: Window size in one-minute buckets.

  responses:
    Unauthorized:
      description: Missing or invalid credential or identity
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ForbiddenScope:
      description: Valid credential but missing required scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ScopeError"
    ForbiddenRole:
      description: Identity present but role below the required minimum
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RoleError"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidInput:
      description: Invalid query or body input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: Content-Type is not application/json
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Global per-IP rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          oneOf:
            - type: object
              required: [code, message]
              properties:
                code:
                  type: string
                  enum: [NOT_FOUND, INVALID_INPUT, INTERNAL, RATE_LIMITED, UNSUPPORTED_MEDIA_TYPE]
                message:
                  type: string
                request_id:
                  type: string
            - type: object
              properties:
                error:
                  type: string

    ScopeError:
      type: object
      required: [error, required]
      properties:
        error:
          type: string
        required:
          type: string

    RoleError:
      type: object
      required: [error, required, role]
      properties:
        error:
          type: string
        required:
          type: string
        role:
          type: string

    Contract:
      type: object
      required: [id, network, label, wasm_hash, created_at_ledger, backfill_complete_at, status, added_at]
      properties:
        id:
          type: string
        network:
          type: string
        label:
          type: string
        wasm_hash:
          type: string
        created_at_ledger:
          type: integer
          format: int64
        backfill_complete_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [pending, active, backfilling, error, paused]
        added_at:
          type: string
          format: date-time

    Event:
      type: object
      required:
        - id
        - contract_id
        - network
        - ledger
        - ledger_closed_at
        - tx_hash
        - type
        - topic_xdr
        - value_xdr
        - topic_decoded
        - value_decoded
        - in_successful_call
      properties:
        id:
          type: string
        contract_id:
          type: string
        network:
          type: string
        ledger:
          type: integer
          format: int32
        ledger_closed_at:
          type: string
          format: date-time
        tx_hash:
          type: string
        type:
          type: string
        topic_xdr:
          type: array
          items:
            type: string
        value_xdr:
          type: string
        topic_decoded:
          type: array
          items: {}
        value_decoded: {}
        in_successful_call:
          type: boolean

    Invocation:
      type: object
      required:
        - tx_hash
        - contract_id
        - network
        - ledger
        - ledger_closed_at
        - status
        - function_name
        - args_decoded
        - result_decoded
        - result_xdr
        - resource_fee_charged
        - cpu_insn
        - mem_byte
        - ledger_read_byte
        - ledger_write_byte
        - application_order
      properties:
        tx_hash:
          type: string
        contract_id:
          type: string
        network:
          type: string
        ledger:
          type: integer
          format: int32
        ledger_closed_at:
          type: string
          format: date-time
        status:
          type: string
        function_name:
          type: string
        args_decoded:
          type: object
          additionalProperties: true
        result_decoded: {}
        result_xdr:
          type: string
        resource_fee_charged:
          type: integer
          format: int64
        cpu_insn:
          type: integer
          format: int64
        mem_byte:
          type: integer
          format: int64
        ledger_read_byte:
          type: integer
          format: int64
        ledger_write_byte:
          type: integer
          format: int64
        application_order:
          type: integer

    StorageEntry:
      type: object
      required: [contract_id, network, key_xdr, value_xdr, durability, live_until_ledger, last_modified_ledger, status, last_seen_at]
      properties:
        contract_id:
          type: string
        network:
          type: string
        key_xdr:
          type: string
        key_decoded: {}
        value_xdr:
          type: string
        value_decoded: {}
        durability:
          type: string
        live_until_ledger:
          type: integer
          format: int64
        last_modified_ledger:
          type: integer
          format: int64
        status:
          type: string
        last_seen_at:
          type: string
          format: date-time

    ContractStats:
      type: object
      required:
        - event_count
        - invocation_count
        - storage_count
        - last_synced_ledger
        - window_event_count
        - window_invocation_count
        - window_duration
      properties:
        event_count:
          type: integer
          format: int64
        invocation_count:
          type: integer
          format: int64
        storage_count:
          type: integer
          format: int64
        last_synced_ledger:
          type: integer
          format: int32
        window_event_count:
          type: integer
          format: int64
        window_invocation_count:
          type: integer
          format: int64
        window_duration:
          type: string

    ForecastPoint:
      type: object
      required: [date, value, lower, upper]
      properties:
        date:
          type: string
          format: date
        value:
          type: number
          format: double
        lower:
          type: number
          format: double
        upper:
          type: number
          format: double

    ForecastSeries:
      type: object
      required: [metric, horizon, daily_count, points]
      properties:
        metric:
          type: string
          enum: [fees, invocations, events]
        horizon:
          type: integer
        daily_count:
          type: integer
        points:
          type: array
          items:
            $ref: "#/components/schemas/ForecastPoint"

    ContractSnapshot:
      type: object
      required: [contract_id, network, ledger, first_tracked_ledger, storage, last_event]
      properties:
        contract_id:
          type: string
        network:
          type: string
        ledger:
          type: integer
          format: int32
        first_tracked_ledger:
          type: integer
          format: int32
        storage:
          type: array
          items:
            $ref: "#/components/schemas/StorageEntry"
        last_event:
          description: The last event at or before the ledger, or null if none.
          allOf:
            - $ref: "#/components/schemas/Event"
          nullable: true
          type: object

    APIKey:
      type: object
      required: [id, name, key_prefix, scopes, created_at, last_used_at, revoked_at]
      properties:
        id:
          type: string
        name:
          type: string
        key_prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true

    Watchlist:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WatchlistItem"

    WatchlistItem:
      type: object
      required: [contract_id, added_at]
      properties:
        contract_id:
          type: string
        added_at:
          type: string
          format: date-time

    InWatchlist:
      type: object
      required: [in_watchlist]
      properties:
        in_watchlist:
          type: boolean

    WatchdogStats:
      type: object
      required: [total_monitored, healthy, degraded, unresponsive, total_alerts, critical_alerts]
      properties:
        total_monitored:
          type: integer
          format: int64
        healthy:
          type: integer
          format: int64
        degraded:
          type: integer
          format: int64
        unresponsive:
          type: integer
          format: int64
        total_alerts:
          type: integer
          format: int64
        critical_alerts:
          type: integer
          format: int64

    ContractAlert:
      type: object
      required: [contract_id, severity, message, ledger, tx_hash, timestamp]
      properties:
        contract_id:
          type: string
        severity:
          type: string
          enum: [Info, Warning, Critical]
        message:
          type: string
        ledger:
          type: integer
          format: int64
        tx_hash:
          type: string
        timestamp:
          type: string
          format: date-time

    MonitoredContract:
      type: object
      required: [contract_id, network, name, owner, status, last_check, check_interval, registered_at, updated_at]
      properties:
        contract_id:
          type: string
        network:
          type: string
        name:
          type: string
        owner:
          type: string
        status:
          type: string
        last_check:
          type: string
          format: date-time
          nullable: true
        check_interval:
          type: integer
          format: int64
        registered_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    HealthCheck:
      type: object
      required: [contract_id, status, metadata, ledger, tx_hash, timestamp]
      properties:
        contract_id:
          type: string
        status:
          type: string
        metadata:
          type: string
        ledger:
          type: integer
          format: int64
        tx_hash:
          type: string
        timestamp:
          type: string
          format: date-time

    # ------------------------------------------------------------------------
    # Live dashboard (#139)
    # ------------------------------------------------------------------------
    ContractEventRate:
      type: object
      required: [contract_id, label, network, total, per_minute]
      properties:
        contract_id:
          type: string
        label:
          type: string
        network:
          type: string
        total:
          type: integer
          description: Events observed in the window across all buckets.
        per_minute:
          type: array
          description: |
            One bucket per minute over the window, oldest first. The length
            always equals the requested minute count, so the series is
            contiguous and a sparkline's x-axis never shifts.
          items:
            type: integer

    # ------------------------------------------------------------------------
    # Contract validation (#140)
    # ------------------------------------------------------------------------
    ValidateContractResponse:
      type: object
      required: [valid, contract_id, network, already_tracked, label, reason]
      properties:
        valid:
          type: boolean
        contract_id:
          type: string
        network:
          type: string
        already_tracked:
          type: boolean
        label:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true

    # ------------------------------------------------------------------------
    # API v2 (#144)
    # ------------------------------------------------------------------------
    V2Pagination:
      type: object
      required: [next_cursor, has_more]
      properties:
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor; null on the last page.
        has_more:
          type: boolean

    V2Contract:
      type: object
      required: [id, network, label, wasm_hash, created_at_ledger, backfill_complete_at, status, added_at]
      properties:
        id:
          type: string
        network:
          type: string
        label:
          type: string
          nullable: true
        wasm_hash:
          type: string
          nullable: true
        created_at_ledger:
          type: integer
          format: int64
        backfill_complete_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
        added_at:
          type: string
          format: date-time

    V2Event:
      type: object
      required: [id, contract_id, network, ledger, ledger_closed_at, tx_hash, type, topic_xdr, value_xdr, topic_decoded, value_decoded, in_successful_call]
      properties:
        id:
          type: string
        contract_id:
          type: string
        network:
          type: string
        ledger:
          type: integer
          format: int64
        ledger_closed_at:
          type: string
          format: date-time
        tx_hash:
          type: string
        type:
          type: string
        topic_xdr:
          type: array
          items:
            type: string
        value_xdr:
          type: string
        topic_decoded:
          type: array
          items: {}
        value_decoded: {}
        in_successful_call:
          type: boolean

    V2Invocation:
      type: object
      required: [tx_hash, contract_id, network, ledger, ledger_closed_at, status, function_name, resource_fee_charged_stroops, cpu_instructions, memory_bytes, ledger_read_bytes, ledger_write_bytes, application_order]
      properties:
        tx_hash:
          type: string
        contract_id:
          type: string
        network:
          type: string
        ledger:
          type: integer
          format: int64
        ledger_closed_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [SUCCESS, FAILED, NOT_FOUND]
        function_name:
          type: string
          nullable: true
        args_decoded:
          type: object
          nullable: true
        result_decoded: {}
        result_xdr:
          type: string
        resource_fee_charged_stroops:
          type: integer
          format: int64
          description: Renamed from v1's unitless `resource_fee_charged`.
        cpu_instructions:
          type: integer
          format: int64
        memory_bytes:
          type: integer
          format: int64
        ledger_read_bytes:
          type: integer
          format: int64
        ledger_write_bytes:
          type: integer
          format: int64
        application_order:
          type: integer

    V2StorageEntry:
      type: object
      required: [contract_id, network, key_xdr, key_decoded, value_xdr, value_decoded, durability, live_until_ledger, last_modified_ledger, status, last_seen_at]
      properties:
        contract_id:
          type: string
        network:
          type: string
        key_xdr:
          type: string
        key_decoded: {}
        value_xdr:
          type: string
        value_decoded: {}
        durability:
          type: string
          enum: [temporary, persistent, instance]
        live_until_ledger:
          type: integer
          format: int64
        last_modified_ledger:
          type: integer
          format: int64
        status:
          type: string
          enum: [live, archived, deleted]
        last_seen_at:
          type: string
          format: date-time

    V2ContractStats:
      type: object
      required: [event_count, invocation_count, storage_count, last_synced_ledger, window_event_count, window_invocation_count, window_duration]
      properties:
        event_count:
          type: integer
          format: int64
        invocation_count:
          type: integer
          format: int64
        storage_count:
          type: integer
          format: int64
        last_synced_ledger:
          type: integer
          format: int64
        window_event_count:
          type: integer
          format: int64
        window_invocation_count:
          type: integer
          format: int64
        window_duration:
          type: string

    V2GlobalStats:
      type: object
      required: [tracked_contracts, total_events, total_invocations, total_storage_entries]
      properties:
        tracked_contracts:
          type: integer
          format: int64
        total_events:
          type: integer
          format: int64
        total_invocations:
          type: integer
          format: int64
        total_storage_entries:
          type: integer
          format: int64

    V2ContractRate:
      type: object
      required: [contract_id, label, network, total, per_minute]
      properties:
        contract_id:
          type: string
        label:
          type: string
          nullable: true
        network:
          type: string
        total:
          type: integer
          format: int64
        per_minute:
          type: array
          items:
            type: integer

    V2ActivityResponse:
      type: object
      required: [minutes, window_start, data]
      properties:
        minutes:
          type: integer
        window_start:
          type: string
          format: date-time
        data:
          type: array
          items:
            $ref: "#/components/schemas/V2ContractRate"

    V2Upgrade:
      type: object
      required: [contract_id, from_hash, to_hash, ledger, tx_hash, at]
      properties:
        contract_id:
          type: string
        from_hash:
          type: string
        to_hash:
          type: string
        ledger:
          type: integer
          format: int64
        tx_hash:
          type: string
          nullable: true
        at:
          type: string
          format: date-time

    V2ContractHealthScore:
      type: object
      required: [contract_id, score, components, computed_at]
      properties:
        contract_id:
          type: string
        score:
          type: integer
          format: int32
        components:
          type: object
          required: [uptime, error_rate, performance, storage_ttl]
          properties:
            uptime:
              type: integer
              format: int32
            error_rate:
              type: integer
              format: int32
            performance:
              type: integer
              format: int32
            storage_ttl:
              type: integer
              format: int32
        computed_at:
          type: string
          format: date-time

    V2MonitoredContract:
      type: object
      required: [contract_id, network, name, owner, status, last_check, check_interval, registered_at, updated_at]
      properties:
        contract_id:
          type: string
        network:
          type: string
        name:
          type: string
        owner:
          type: string
        status:
          type: string
        last_check:
          type: string
          format: date-time
          nullable: true
        check_interval:
          type: integer
          format: int64
        registered_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    V2HealthCheck:
      type: object
      required: [contract_id, status, metadata, ledger, tx_hash, timestamp]
      properties:
        contract_id:
          type: string
        status:
          type: string
        metadata:
          type: string
        ledger:
          type: integer
